name: tests

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests (standard library only)
        run: python -m unittest tests.test_gate -v
      - name: Install the SDK
        run: pip install -r requirements.txt
      - name: Agent wiring tests
        run: python -m unittest tests.test_agent_options -v
